<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="div-style">
            <h1>let's chat</h1>
            <div>
                <br>
                <P>Whether you have a question, want to start a project or simply want to connect.</P>
                <br>
                <P>Feel free to send me a message in the contact form</P>
            </div>
        </div>

        <form class="form" action="" autocomplete="off">
            <h1 class="h1">contact</h1>
            <span class="required">* Required</span>
            <br>

            <input name="firstName" placeholder="enter first name" required>
            <br>

            <input type="email" name="email" placeholder="enter your email" required>
            <br>

            <input placeholder="Company">
            <br>

            <input type="text" name="phone" placeholder="phone" pattern="01(0|1|2|5)[0-9]{8}" maxlength="11">
            <br>

            <textarea placeholder="Message" cols="22" rows="4"></textarea>

            <div>
                <button type="submit" class="button">Submit</button>
            </div>
        </form>

    </div>

</body>
</html>
